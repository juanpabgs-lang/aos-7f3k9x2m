const PLAN = { hall: [-2.5, 17, 34], room: { 1: [-2.2, 7.0], 2: [10, 19.2], 3: [22.2, 31.4] }, door: { 1: 2.4, 2: 14.6, 3: 26.8 }, pasillo: [31.7, 6],

  strip: [-2.5, 0, 17, 7], park: [[-1.2, 2.6], [-1.2, 5.6]], emb: [5.2, 24, 10.4, 34], work: [-2.5, 7, 5.0, 26],
  antX: [6.1, 9.5], antZ: [8.5, 10.5, 12.5, 14.5, 16.5, 18.5] }; // medidas del croquis de JP (12 nov); antecámara: 2 columnas × 6 filas, con carril en medio

  cell(v) { S.torre.sel = v || null; },
  excMap(id) { const e = S.exc.find(x => x.id === id); if (!e) return; S.torre.sel = e.where.startsWith('ANT') ? e.where : e.where.split('-')[0]; const el = document.getElementById('mapCard'); if (el) setTimeout(() => { const c = document.querySelector('.c.sel'); if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 30); },
  excAct(id) {
    const e = S.exc.find(x => x.id === id); if (!e) return;
    if (e.after) { e.state = e.after; log('torre', 'Daniel', `${e.title} (${e.where}): ${e.after.toLowerCase()}.`); toast(e.after); return; }
    if (e.act === 'Ir al arribo') { S.view = 'arribo'; window.scrollTo(0, 0); return; }
    if (e.act === 'Ir a conteo cíclico') { S.view = 'conteo'; window.scrollTo(0, 0); return; }

  sicMark(id) { S.sicCap[id] = S.clock; log('torre', 'Lucía', `marcó como capturado en Siconet (${id}).`); },
  sicExport() {
    const rows = sicRows().filter(r => r.ready && !S.sicCap[r.id] && !S.sicExp[r.id]); if (!rows.length) return;

    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const csv = [head.join(',')].concat(rows.map(r => ['2026-11-11', HM(r.t), r.tipo, r.ref, r.oc, r.sku, SKU[r.sku].d, r.cajas, SKU[r.sku].fe, r.cajas * SKU[r.sku].fe, r.from, r.to, r.scans, r.by].map(q).join(','))).join('\n');

    window.__lastCsv = csv; rows.forEach(r => { S.sicExp[r.id] = S.clock; }); log('torre', 'Lucía', `exportó ${rows.length} traspasos para Siconet.`); toast(`${rows.length} traspasos exportados en CSV`);
  },
  // conteo
  cntType() { S.cnt.showType = !S.cnt.showType; S.cnt.typed = ''; },
  cntScanLoc(v) { const C = S.cnt, x = CNT[C.i]; if (!x || C.phase !== 'loc') return; const code = v === '__typed' ? normCode(C.typed) : (v || x.loc); if (code !== x.loc) { C.err = `Escaneaste ${parseLoc(code) ? shortLoc(code) : code}. Toca contar ${shortLoc(x.loc)}.`; log('cnt', 'Marta', `escaneó ${code}: no es la posición. Bloqueado.`, 'red'); return; } C.err = null; C.phase = 'pal'; C.typed = ''; C.showType = false; tick(60); log('cnt', 'Marta', `llegó a ${shortLoc(x.loc)}.`); },
  cntScanPal(v) { const C = S.cnt, x = CNT[C.i]; if (!x || C.phase !== 'pal') return; const code = v === '__typed' ? normCode(C.typed) : (v || x.box); if (!inPal(code, x)) { C.err = `Esa caja no es de la tarima que el sistema tiene en ${shortLoc(x.loc)}.`; log('cnt', 'Marta', `la caja ${code} no coincide con ${x.loc}.`, 'red'); return; } C.err = null; C.phase = 'count'; C.typed = ''; C.showType = false; tick(20); },
  cntVal(v) { S.cnt.val = v.replace(/[^\d]/g, ''); return 'skip'; },
  cntRecord() {
    const C = S.cnt, x = CNT[C.i]; if (!x || C.phase !== 'count') return; if (C.val === '') { toast('Escribe cuántas cajas contaste'); return; }
    const got = +C.val, exp = LOC[x.loc].cajas, ok = got === exp; C.res[C.i] = { got, exp, ok, diff: got - exp };
    S.kpi.accN++; if (ok) S.kpi.accOk++; tick(90);
    log('cnt', 'Marta', `contó ${got} cajas en ${shortLoc(x.loc)}${ok ? ' · cuadra' : ` · diferencia ${got - exp > 0 ? '+' : ''}${got - exp}`}.`, ok ? 'green' : 'red');
    if (S.flags[x.loc] === 'amber') delete S.flags[x.loc];
    if (!ok) { S.flags[x.loc] = 'amber'; addExc({ sev: 'amber', title: 'Diferencia de conteo', where: x.loc, text: `Marta contó ${got} cajas; el sistema tiene ${exp}. Pasa a recuento del supervisor.`, act: 'Recuento hecho' }); }
    const e3 = S.exc.find(e => e.id === 'e3'); if (e3 && !e3.state && !['2A10-1', '2A12-2'].some(c => S.flags[c])) { e3.state = '2 de 3 contadas hoy'; }
    C.i++; C.phase = 'loc'; C.val = ''; C.err = null;
    if (C.i >= CNT.length) log('cnt', 'Sistema', `exactitud del conteo: ${C.res.filter(r => r.ok).length} de ${CNT.length}. Inventario: ${kpiAcc().toFixed(1)}%.`);
  },
  cntSim() { const C = S.cnt, x = CNT[C.i]; if (!x) return; if (C.phase === 'loc') A.cntScanLoc(); if (C.phase === 'pal') A.cntScanPal(); const sim = { '2A16-2': 80 }; C.val = String(sim[x.loc] != null ? sim[x.loc] : LOC[x.loc].cajas); A.cntRecord(); },
  // tour
  tourStart() { runTour(); },
  tourPause() { if (S.tour) { S.tour.paused = !S.tour.paused; drawTour(); } },
  tourPrev() { if (S.tour) tourJump(S.tour.i - 1); return 'skip'; },
  // Siguiente mientras un paso se está reproduciendo lo salta: termina al instante y sigue con el próximo
  tourNext() { const T = S.tour; if (!T) return 'skip'; if (T.i + 1 >= TOUR.length && !T.running) { A.tourExit(); return; } if (T.running) { T.skip = true; window.__animX = 300; } T.advance = true; drawTour(); return 'skip'; },
  tourSpeed() { ANIM_X = ANIM_X === 1 ? 10 : 1; if (!(S.tour && S.tour.skip)) window.__animX = ANIM_X; drawTour(); return 'skip'; },
  tourPart(v) { const k = tourPartStart(v); if (S.tour && k >= 0) tourJump(k); return 'skip'; },
  tourExit() { TOUR_GEN++; TOUR_FF = false; if (S.tour) S.tour.on = false; endTour(); }
};

/* ============ render + events ============ */
let lastView = null;
function render() {
  const app = document.getElementById('app');
  if (lastView && lastView !== S.view) { const t = document.getElementById('toast'); if (t) t.innerHTML = ''; } lastView = S.view;
  const V = { arribo: vArribo, acomodo: vAcomodo, surtido: vSurtido, torre: vTorre, conteo: vConteo, fase2: vFase2, traza: vTrazaFile }[S.view];
  app.innerHTML = topbar() + `<main class="wrap" id="main">${V()}<p class="pfooter">Prototipo con datos ficticios. El flujo se confirma con el equipo de Austral antes de construir.</p></main>`;
  if (S.hl) { const el = document.querySelector(S.hl); if (el) el.classList.add('tour-hl'); }
}
function toast(msg) { const t = document.getElementById('toast'); t.innerHTML = `<div class="toast" role="status">${ESC(msg)}</div>`; clearTimeout(toast._t); toast._t = setTimeout(() => { t.innerHTML = ''; }, 2600); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (S.tour && S.tour.on && !el.closest('#tour')) { A.tourNext(); return; }
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.disabled) return;
  const r = fn(el.dataset.v, el); if (r !== 'skip') render();
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (!el) return; const fn = A[el.dataset.in]; if (fn) fn(el.value, el); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const el = e.target.closest('[data-enter]'); if (!el || el.tagName === 'TEXTAREA') return; e.preventDefault();
  const fn = A[el.dataset.enter]; if (!fn) return; const r = fn('__typed'); if (r !== 'skip') render();
});

const TOUR_PARTS = [['arribo', 'Arribo'], ['acomodo', 'Acomodo'], ['surtido', 'Surtido'], ['conteo', 'Conteo'], ['torre', 'Torre']];
function tourPartStart(view) { return TOUR.findIndex(st => st.go === view); }
async function runTour(from) {
  from = Math.max(0, Math.min(TOUR.length - 1, from || 0)); const gen = ++TOUR_GEN; const t0 = Date.now();
  const alive = () => gen === TOUR_GEN && S.tour && S.tour.on;
  fresh(); S.tour = { on: true, i: from, paused: false, advance: false, running: false, skip: false }; document.body.classList.add('touring'); window.__animX = ANIM_X;
  if (from > 0) { // replay the earlier steps instantly so the screens are where that step expects them
    TOUR_FF = true;
    try { for (let i = 0; i < from; i++) { const st = TOUR[i]; if (st.go) S.view = st.go; if (st.run) await st.run(); if (gen !== TOUR_GEN) return; } render(); }
    finally { if (gen === TOUR_GEN) TOUR_FF = false; }
    window.scrollTo(0, 0);
  }
  render(); drawTour();
  for (let i = from; i < TOUR.length; i++) {
    if (!alive()) return; S.tour.i = i; const st = TOUR[i];
    if (st.go && S.view !== st.go) { S.view = st.go; window.scrollTo(0, 0); }
    S.hl = st.hl && document.querySelector(st.hl) ? st.hl : null; S.tour.running = true; drawTour(); render();
    const el0 = S.hl && document.querySelector(S.hl); if (el0 && S.hl !== '#phone') el0.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (st.run) await st.run();
    if (!alive()) return;
    // let what this step set moving finish (forklifts, pallets in the 3D view) before it counts as done
    while (alive() && window.__tourBusy && window.__tourBusy()) await wait(120);
    if (!alive()) return;
    S.tour.skip = false; window.__animX = ANIM_X; // a skipped step ends here; the next one plays at the chosen speed
    S.hl = st.hl || null; S.tour.running = false; render(); drawTour();
    const el = st.hl && document.querySelector(st.hl);
    if (el && st.hl !== '#phone') el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    // the tour waits for the presenter: Siguiente plays the next step
    while (alive() && !S.tour.advance) await wait(100);
    if (!alive()) return; S.tour.advance = false;
  }
  window.__tourMs = Date.now() - t0; endTour();
}
function tourJump(i) { if (!S.tour) return; runTour(i).then(() => {}); }
function drawTour() {
  const box = document.getElementById('tour'); if (!S.tour || !S.tour.on) { box.innerHTML = ''; return; }
  const i = S.tour.i, st = TOUR[i], run = S.tour.running;
  const cur = TOUR_PARTS.reduce((acc, [v], k) => { const a = tourPartStart(v); return a >= 0 && a <= i ? k : acc; }, 0);
  const parts = TOUR_PARTS.map(([v, t], k) => `<button class="${k === cur ? 'on' : ''}" data-a="tourPart" data-v="${v}">${t}</button>`).join('');
  const note = st.note ? `<aside class="tournote" id="tourNote"><b>Qué está pasando</b><p>${ESC(st.note)}</p></aside>` : '';
  box.innerHTML = `${note}<div class="tourcap" role="status" aria-live="polite"><div class="tparts" role="group" aria-label="Ir a una parte">${parts}</div><span class="n">${i + 1} / ${TOUR.length}${run ? ' · <b class="tplay">reproduciendo</b>' : ''}</span><p>${ESC(st.cap)}</p><div class="row-btns tctl" style="flex-wrap:nowrap"><button class="btn sm" data-a="tourPrev" id="tourPrev" ${i === 0 ? 'disabled' : ''} aria-label="Paso anterior">‹ Atrás</button><button class="btn sm tspeed" data-a="tourSpeed" id="tourSpeed" aria-label="Velocidad de las animaciones" title="Velocidad de las animaciones">×${ANIM_X}</button><button class="btn sm primary" data-a="tourNext" id="tourNext" aria-label="${run ? 'Saltar la animación' : 'Paso siguiente'}">${run ? 'Saltar ›' : i + 1 < TOUR.length ? 'Siguiente ›' : 'Terminar'}</button><button class="btn sm" data-a="tourExit" id="tourExit">Salir</button></div><div class="bar"><i style="width:${(i + 1) / TOUR.length * 100}%"></i></div></div>`;
}
function endTour() { if (S.tour) S.tour.on = false; S.tour = null; S.hl = null; window.__animX = 1; document.body.classList.remove('touring'); drawTour(); render(); }

fresh(); render();
</script>
</body>
